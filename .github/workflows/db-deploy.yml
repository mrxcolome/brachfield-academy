name: DB migrate (Neon)

# Aplica migraciones a la BD de producción (Neon).
# Requiere el secreto DATABASE_URL en GitHub → Settings → Secrets → Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['prisma/migrations/**']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx prisma db seed
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
