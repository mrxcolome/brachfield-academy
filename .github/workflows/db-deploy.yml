name: DB migrate (Neon)

# Aplica migraciones a la BD de producción (Neon).
# Requiere el secreto DATABASE_URL en GitHub → Settings → Secrets → Actions.
on:
  workflow_dispatch:
    inputs:
      seed_editorial:
        description: 'Cargar contenido editorial de ejemplo (¡BORRA el contenido existente del CMS!)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['prisma/migrations/**', 'src/migrations/**']

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx prisma db seed
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx payload migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Verificación: imprime las columnas de portadas y las migraciones
      # registradas, para poder comprobar en el log que la BD quedó bien.
      - name: Verificar columnas de portadas
        run: node scripts/verify-cover-columns.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npx tsx src/payload/seed.ts
        if: github.event_name == 'workflow_dispatch' && inputs.seed_editorial
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
